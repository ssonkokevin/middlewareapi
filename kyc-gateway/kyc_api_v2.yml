                  summary: Missing required organisation field
                  value:
                    status: error
                    error_code: MISSING_FIELD
                    message: organisation_name is required
                invalid_payload:
                  summary: Invalid corporate payload
                  value:
                    status: error
                    error_code: INVALID_PAYLOAD
                    message: representative is required
        "500":
          description: Unexpected processing failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
