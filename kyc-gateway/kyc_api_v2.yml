openapi: 3.0.3

info:
  title: KYC Verification API
  version: 2.0.0
  description: |
    The KYC Verification API enables Mobile Network Operators (MNOs) to submit
    SIM registration information for validation and compliance.

    ----------------------------------------------------------------------
    OVERVIEW
    ----------------------------------------------------------------------
    This API is designed to support SIM registration workflows by:
      - checking SIM ownership eligibility/ limits before registration
      - verifying subscriber identity and biometric data against the external registries
        (NIRA, UNHCR, NCIC, URSB, etc)
      - accepting or rejecting SIM registration records
      - supporting full subscriber record updates with re-verification
      - supporting asynchronous batch uploads for high-volume operations
      - notifying operators of batch completion through a signed callback (webhook)
      - generating compliance reports

    ----------------------------------------------------------------------
    WHAT CHANGED IN 2.0.0 (BREAKING)
    ----------------------------------------------------------------------
    Identity verification is now a separate step from registration.

      - NEW  POST /identity_verification returns a verification_reference.
      - The registration endpoints no longer carry a `biometric` object.
        They carry `verification_reference` instead.
      - `eligibility_token` is removed, along with its two reason codes.
      - `id_type` is reduced from seven values to three.
      - Biometric payloads are now provider-specific: a signed MOSIP SBI block
        for NIRA, an ISO/IEC 19794-4 image record for all other registries.

    ----------------------------------------------------------------------
    AUTHENTICATION
    ----------------------------------------------------------------------
    Every endpoint requires an API key supplied in the `X-API-Key` request header.
    A missing or unrecognised key returns HTTP 401 with error_code `UNAUTHORIZED`.
    The key identifies the calling MNO; data-scoped endpoints (e.g. compliance
    report) are automatically filtered to that MNO.

    ----------------------------------------------------------------------
    TWO-STEP REGISTRATION FLOW
    ----------------------------------------------------------------------
    Registration is a two-step operation. Verification happens first, and
    registration second.

      STEP 1 (required)  POST /ownership_check
                         The authoritative ownership decision. Call it BEFORE
                         capturing a biometric. It is not enforced by the API —
                         but skipping it means paying for a verification that
                         the registration will then refuse. Returns no token.

      STEP 2 (required)  POST /identity_verification
                         Send the identity and the biometric for validation
                         against the external registry (NIRA, UNHCR, NCIC or
                         URSB) in the format described below. This endpoint does
                         NOT evaluate the ownership limit — it must remain usable
                         for SIM swap, agent and fraud checks, where the SIM
                         count is irrelevant. On success you receive a true/false
                         result and a `verification_reference`.

      STEP 3 (required)  POST /individual_registrations
                         POST /corporate_registrations
                         POST /individual_registrations/batch
                         POST /corporate_registrations/batch
                         Send the full record plus the verification_reference.
                         No biometric. No time limit.

    verification_reference rules:
      - bound to the id_type + id_number verified in step 2; presenting it with
        a different identity returns VERIFICATION_REFERENCE_MISMATCH
      - valid for 24 hours; after that VERIFICATION_REFERENCE_EXPIRED
      - reusable within its lifetime, so a failed SIM provisioning does not
        force the subscriber to present a finger again. Every use is recorded.
      - required by every registration endpoint, including PUT updates and
        every record inside a batch

    Why the split: the NIRA biometric freshness window (about 30 seconds) and
    the provider-specific biometric format now apply to step 2 only. Step 3 is
    untimed and format-free, which is what makes batch registration workable.

    ----------------------------------------------------------------------
    IDENTITY PROVIDERS AND BIOMETRIC FORMATS
    ----------------------------------------------------------------------
    `id_type` selects the authority that verifies the subscriber:

      id_type           provider   status    biometric format
      ----------------  ---------  --------  --------------------------------------
      NATIONAL ID       NIRA       live      MOSIP_SBI_SIGNED (device-signed block)
      REFUGEE ID        UNHCR      live      ISO_19794_4 (finger image record)
      PASSPORT          NCIC       planned   not yet applicable
      COI               URSB       planned   none — an organisation has no biometric
      REGISTRY_PENDING  undecided  planned   none — an organisation has no biometric

    NIRA — MOSIP_SBI_SIGNED
      NIRA does not accept a bare template. It requires the block produced and
      signed by a MOSIP-certified SBI capture device. Submit that block exactly
      as the device produced it, inside `biometric.blocks`. UCC relays it to
      NIRA unmodified — it does not parse, validate or reshape it. Altering the
      block after capture will fail signature verification at NIRA.

      Two NIRA constraints follow from this:
        - the signed block must reach NIRA within about 30 SECONDS of capture,
          so capture immediately before calling /identity_verification
        - the block's signed transactionId must equal the `transaction_id` sent
          in the request

    UNHCR and future providers — ISO_19794_4
      Send a full ISO/IEC 19794-4 finger IMAGE record, Base64 encoded, in
      `biometric.data`. Note this is an image record and NOT an ISO/IEC 19794-2
      minutiae template. Do not send extracted minutiae, and do not send a bare
      JPEG or PNG file.

    NCIC is not yet integrated. A PASSPORT verification returns verified=false
    with reason_code VERIFICATION_UNAVAILABLE and provider_status PLANNED. A
    reference is still issued, so the registration can proceed and be recorded
    as unverified. When NCIC becomes available the same endpoint begins
    returning real verdicts — no contract change is required.

    ORGANISATION VERIFICATION
      An organisation is verified against its own registry, NOT through a
      nominated person. There is no biometric anywhere in the corporate flow, so
      the ~30 second NIRA freshness window does not apply to it.

      No organisation registry is integrated yet. EVERY corporate verification
      currently returns verified=false with reason_code
      VERIFICATION_UNAVAILABLE and provider_status PLANNED. A reference is still
      issued, so registration can proceed and is recorded as unverified.

      COI is routed to URSB, which is not connected. REGISTRY_PENDING has no
      routed authority at all — UCC has not decided which body verifies the
      remaining organisation types.

      Consequence: until a registry is live, 100% of corporate registrations are
      unverified. The representative details carried on the record are the only
      accountability anchor on a corporate SIM.

    Important biometric handling rules:
      - Biometric data is processed transiently and is NEVER persisted by this
        API. There is no biometric column in any table.
      - Biometric data appears only on POST /identity_verification. It must
        never be sent to a registration endpoint.
      - Application logs must never record biometric data.
      - Fingerprint is the only modality operators currently submit. IRIS is
        reserved in the schema for subscribers who cannot provide a fingerprint.
        For registries other than NIRA, ISO/IEC 19794-6 is supported for IRIS.

    ----------------------------------------------------------------------
    OWNERSHIP LIMIT POLICY
    ----------------------------------------------------------------------
    SIM ownership limits are configurable internally by UCC administrative users.
    Therefore, the API response should be treated as the source of truth rather
    than relying on any hard-coded ownership thresholds in MNO systems.

    Limits are resolved in the following priority order:
      1. Subscriber-specific override  — a limit set for a specific individual or corporate subscriber per network
      2. Subscriber-type default       — a limit that applies to all individual or corporate subscribers per network
      3. Global fallback               — applies when no more-specific rule exists (10 per individual per network & 100 per corporate subscriber per network)

    For individual subscribers, the ownership count is the number of accepted SIM
    registrations linked to that identity per network. For corporate subscribers, it is the
    number of accepted SIM registrations linked to that company registration number per network.

    The limit is evaluated at two points:
      1. POST /ownership_check        — the authoritative check
      2. at registration commit time  

    A registration that would exceed the limit is rejected with HTTP 403 and
    error_code LIMIT_EXCEEDED, even when a valid verification_reference is
    supplied.

    ----------------------------------------------------------------------
    STANDARDIZED REASON CODES
    ----------------------------------------------------------------------
    The API uses standardized reason codes to support consistent operational
    behavior and reporting.

    Primary stakeholder-approved codes:
      - LIMIT_EXCEEDED
      - LIMIT_NOT_EXCEEDED
      - INVALID_FIELD
      - IDENTITY_ACCEPTED
      - IDENTITY_REJECTED

    Verification outcome codes (POST /identity_verification):
      - IDENTITY_ACCEPTED         provider confirmed the subscriber
      - IDENTITY_REJECTED         provider did not confirm the subscriber
      - VERIFICATION_UNAVAILABLE  no provider is integrated for this id_type

    Registration outcome code:
      - REGISTRATION_ACCEPTED     the record was stored

    verification_reference codes (registration endpoints):
      - VERIFICATION_REQUIRED
      - VERIFICATION_REFERENCE_INVALID
      - VERIFICATION_REFERENCE_MISMATCH
      - VERIFICATION_REFERENCE_EXPIRED

    Additional operational codes used in request validation and processing:
      - INVALID_ID
      - INVALID_MSISDN
      - INVALID_AGENT
      - INVALID_BIOMETRIC
      - MISSING_FIELD
      - DUPLICATE_REQUEST
      - INVALID_PAYLOAD
      - NOT_FOUND
      - SYSTEM_ERROR

    Authentication code:
      - UNAUTHORIZED

    Note: LIMIT_EXCEEDED is used both as a success reason_code (HTTP 200) in an
    ownership check, and as an error error_code (HTTP 403) when a registration is
    blocked by the ownership limit.

    Note: IDENTITY_ACCEPTED and IDENTITY_REJECTED moved in 2.0.0. They are now
    outcomes of POST /identity_verification. A successful registration returns
    REGISTRATION_ACCEPTED.

    ----------------------------------------------------------------------
    UPDATE RULE
    ----------------------------------------------------------------------
    Subscriber updates must be treated as full re-verification events.

    This means:
      - updates use PUT, not PATCH
      - the full registration payload must be resubmitted
      - id_number must be present
      - a FRESH verification_reference must be present. Run
        POST /identity_verification again before the update — an update may not
        reuse the reference that authorised the original registration.
      - the ownership limit is re-evaluated at commit time

    ----------------------------------------------------------------------
    BATCH COMPLETION WEBHOOK
    ----------------------------------------------------------------------
    In addition to the batch status endpoint, the API can notify an operator
    when a batch job reaches a terminal state. This is an outbound HTTP POST
    from UCC to an endpoint hosted by the operator — see the `callbacks`
    section of POST /individual_registrations/batch for the payload schema.

    Configuration:
      - webhook delivery is arranged with UCC, not through this API. Send UCC
        the endpoint URL you want notified; UCC registers it against your
        operator record and issues you a dedicated signing secret in return,
        over a secure channel agreed at onboarding.
      - treat that secret as a credential: hold it in a secret manager, keep it
        out of source control, and never expose it to a browser or mobile client
      - if no URL is registered, no notification is sent — this is a supported
        configuration, not an error condition
      - the endpoint must be reachable from UCC infrastructure and should be
        HTTPS in production

    Delivery semantics:
      - fired once the batch reaches `completed` or `failed`
      - the operator endpoint must answer with a 2xx status code
      - a non-2xx response, a connection error, or a response slower than
        10 seconds is treated as a failed delivery
      - failed deliveries are retried up to 5 times with increasing backoff,
        after which the notification is abandoned
      - delivery is therefore AT-LEAST-ONCE: the same event may arrive more
        than once and operators must process it idempotently, keyed on job_id

    Payload signing:
      - each request carries an `X-KYC-Signature` header of the form
        `sha256=<hex digest>`
      - the digest is an HMAC-SHA256 over the raw, unmodified request body
      - the signing key is the dedicated secret UCC issued to you at webhook
        onboarding. It is symmetric — UCC signs with it and you verify with the
        same value — so both parties must keep it confidential.
      - if you have not been issued a secret, do not implement verification
        against a guessed value; contact UCC. A webhook URL with no secret
        registered against it is a misconfiguration, not a supported setup.
      - verify the signature against the raw body BEFORE parsing the JSON, and
        use a constant-time comparison

    Relationship to polling:
      - the notification carries summary counters only, never per-record
        outcomes; retrieve those from GET /individual_registrations/batch/{job_id}
      - the status endpoint remains the authoritative source of batch state.
        Operators that cannot expose a public endpoint, or that require
        guaranteed delivery, should poll instead.

servers:
  - url: "http://192.168.5.18:8001"
    description: "UCC KYC Gateway"

tags:
  - name: Ownership
    description: |
      Endpoints used to determine whether a subscriber is eligible to register
      a new SIM card under the applicable ownership policy.
  - name: Registration
    description: |
      Endpoints used to submit, update, and batch-process SIM registration data.
  - name: Verification
    description: |
      Endpoint used to verify a subscriber identity and biometric against the
      authority that owns the record, before registration is submitted.
  - name: Compliance
    description: |
      Endpoints used to retrieve compliance reports.

security:
  - ApiKeyAuth: []

paths:
  /ownership_check:
    post:
      tags:
        - Ownership
      summary: Verify SIM ownership eligibility
      description: |
        Checks whether a subscriber is eligible to register a new SIM card.

        This endpoint must be called before registration begins. It evaluates
        the ownership policy configured by UCC for the specific subscriber type
        and returns whether the subscriber is allowed to proceed.

        Business purpose:
          - prevent excessive SIM ownership by individuals and companies
          - support fraud prevention controls
          - provide a consistent policy decision to all MNOs

        Subscriber types:
          - individual: ownership is counted against accepted SimRegistrations
            for the given id_type + id_number combination
          - corporate: ownership is counted against accepted CorporateRegistrations
            for the given registration_number

        Limit resolution order (highest priority first):
          1. Subscriber-specific override (set by UCC per individual or corporate subscriber per network)
          2. Subscriber-type default      (set by UCC for all individuals or all corporate subscribers per network)
          3. Global fallback              (set by UCC as the system-wide default)

        Notes:
          - this endpoint does not register a SIM
          - this endpoint does not verify identity or biometrics
          - proceed to POST /identity_verification next
      operationId: verifyOwnershipEligibility
      requestBody:
        required: true
        description: |
          Subscriber payload used to evaluate ownership eligibility.
          The required fields depend on subscriber_type:
            - individual: id_type and id_number are required
            - corporate:  id_type and registration_number is required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnershipCheckRequest"
            examples:
              individual_national_id:
                summary: Individual check using National ID
                value:
                  subscriber_type: individual
                  id_type: NATIONAL ID
                  id_number: CF123456789ABCDE
              individual_passport:
                summary: Individual check using Passport
                value:
                  subscriber_type: individual
                  id_type: PASSPORT
                  id_number: P12345678
              corporate:
                summary: Corporate ownership check
                value:
                  subscriber_type: corporate
                  id_type: COI
                  registration_number: "80020001234"
      responses:
        "200":
          description: Ownership eligibility decision returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipCheckResponse"
              examples:
                individual_eligible:
                  summary: Individual is allowed to proceed
                  value:
                    status: success
                    data:
                      allowed: true
                      reason_code: LIMIT_NOT_EXCEEDED
                      message: Subscriber can register SIM
                      current_count: 2
                      limit: 5
                corporate_eligible:
                  summary: Corporate is allowed to proceed
                  value:
                    status: success
                    data:
                      allowed: true
                      reason_code: LIMIT_NOT_EXCEEDED
                      message: Subscriber can register SIM
                      current_count: 0
                      limit: 10
                not_eligible:
                  summary: Subscriber has exceeded ownership limit
                  value:
                    status: success
                    data:
                      allowed: false
                      reason_code: LIMIT_EXCEEDED
                      message: Subscriber has exceeded SIM ownership limit
                      current_count: 5
                      limit: 5
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          description: Request payload failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_subscriber_type:
                  summary: subscriber_type not provided
                  value:
                    status: error
                    error_code: MISSING_FIELD
                    message: subscriber_type is required
                invalid_subscriber_type:
                  summary: Unrecognised subscriber_type value
                  value:
                    status: error
                    error_code: INVALID_FIELD
                    message: subscriber_type must be individual or corporate
                missing_id_number:
                  summary: Missing id_number for individual check
                  value:
                    status: error
                    error_code: MISSING_FIELD
                    message: id_number is required
                invalid_id_type:
                  summary: Invalid id_type value
                  value:
                    status: error
                    error_code: INVALID_ID
                    message: Invalid id_type
                missing_registration_number:
                  summary: Missing registration_number for corporate check
                  value:
                    status: error
                    error_code: MISSING_FIELD
                    message: registration_number is required

  /identity_verification:
    post:
      tags:
        - Verification
      summary: Verify subscriber identity and biometric
      description: |
        Verifies a subscriber against the relevant identity registry (NIRA, UNHCR, URSB, NCIC), and
        returns a `verification_reference` for use at registration.

        Processing order:
          1. Validate the request payload
          2. Select the provider from id_type (see IDENTITY PROVIDERS in the
             API description)
          3. Relay the identity and biometric to that provider
          4. Return the outcome and, on success, a verification_reference

        This endpoint does NOT evaluate the ownership limit. That is the job of
        POST /ownership_check, and of the check performed at registration commit.
        Verification is deliberately independent of SIM count so it can also
        serve SIM swap, agent onboarding and fraud checks.

        Timing — this is the only time-critical endpoint in the API. For
        NATIONAL ID, the device-signed block must reach NIRA within about 30
        seconds of capture. Capture the biometric immediately before calling
        this endpoint. If the block goes stale the subscriber must present a
        finger again; the same block cannot be retried.

        A failure to match is NOT an HTTP error. It is HTTP 200 with
        verified=false and reason_code IDENTITY_REJECTED. Branch on
        `data.verified` and `data.reason_code`, never on the HTTP status alone.

        This endpoint is per-subscriber and real time. It is never batched.
      operationId: verifyIdentity
      requestBody:
        required: true
        description: |
          Subscriber identity plus the biometric captured for this verification.
          The biometric format must match the provider for the given id_type.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityVerificationRequest"
            examples:
              national_id_nira:
                summary: National ID — signed MOSIP SBI block relayed to NIRA
                value:
                  id_type: NATIONAL ID
                  id_number: CF123456789ABCDE
                  transaction_id: "9181672570"
                  biometric:
                    biometric_type: FINGERPRINT
                    format: MOSIP_SBI_SIGNED
                    blocks:
                      - specVersion: "0.9.5"
                        data: eyJhbGciOiJSUzI1NiIsIng1YyI6WyJNSUlE...
                        hash: A1B2C3...
                        sessionKey: kR9dP...
                        thumbprint: 3f5a9c...
              refugee_id_unhcr:
                summary: Refugee ID — ISO 19794-4 finger image sent to UNHCR
                value:
                  id_type: REFUGEE ID
                  id_number: UGA-2024-0098765
                  biometric:
                    biometric_type: FINGERPRINT
                    format: ISO_19794_4
                    data: Uk9OQVBJU08xOTc5NDQAAAAA...
              passport_ncic:
                summary: Passport — NCIC not yet integrated, biometric omitted
                value:
                  id_type: PASSPORT
                  id_number: P12345678
                  visa_validity: "2027-06-30"
              company_ursb:
                summary: Company — COI routed to URSB, not yet integrated
                value:
                  id_type: COI
                  id_number: "80020012345678"
              ministry_pending:
                summary: Ministry — no registry decided, no document to verify
                value:
                  id_type: REGISTRY_PENDING
                  id_number: MOH-UG
      responses:
        "200":
          description: |
            Verification completed. Inspect data.verified — a non-match is a
            successful request, not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationResponse"
              examples:
                verified_nira:
                  summary: NIRA confirmed the subscriber
                  value:
                    status: success
                    data:
                      verified: true
                      reason_code: IDENTITY_ACCEPTED
                      message: Identity verified
                      provider: NIRA
                      verification_reference: vrf_01JBK2QX7M4T8ZC3
                      verified_at: "2026-08-24T09:14:22.481Z"
                      expires_at: "2026-08-25T09:14:22.481Z"
                verified_unhcr:
                  summary: UNHCR confirmed the subscriber and corroborated attributes
                  value:
                    status: success
                    data:
                      verified: true
                      reason_code: IDENTITY_ACCEPTED
                      message: Identity verified
                      provider: UNHCR
                      verification_reference: vrf_01JBK3RM9P2W6YD1
                      verified_at: "2026-08-24T09:14:22.481Z"
                      expires_at: "2026-08-25T09:14:22.481Z"
                      matched_attributes:
                        date_of_birth: MATCH
                        sex: F
                not_verified:
                  summary: Biometric did not match the provider record
                  value:
                    status: success
                    data:
                      verified: false
                      reason_code: IDENTITY_REJECTED
                      message: Biometric did not match the identity record
                      provider: NIRA
                provider_unavailable:
                  summary: No provider is integrated for this id_type yet
                  value:
                    status: success
                    data:
                      verified: false
                      reason_code: VERIFICATION_UNAVAILABLE
                      message: No verification provider is currently available for PASSPORT
                      provider: NCIC
                      provider_status: PLANNED
                      verification_reference: vrf_01JBK4TN0Q3X7ZE2
                      expires_at: "2026-08-25T09:14:22.481Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: |
            The subscriber already holds the maximum number of SIM cards. No
            provider was called, so no provider charge was incurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                limit_exceeded:
                  summary: Ownership limit reached — checked before the provider call
                  value:
                    status: error
                    error_code: LIMIT_EXCEEDED
                    message: Subscriber has exceeded SIM ownership limit
        "422":
          description: Request payload failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                stale_capture:
                  summary: Signed block reached the provider too late
                  value:
                    status: error
                    error_code: INVALID_BIOMETRIC
                    message: Biometric capture expired; recapture and retry
                wrong_format:
                  summary: Biometric format does not match the provider
                  value:
                    status: error
                    error_code: INVALID_BIOMETRIC
                    message: NATIONAL ID requires format MOSIP_SBI_SIGNED
                missing_transaction_id:
                  summary: transaction_id absent for a signed block
                  value:
                    status: error
                    error_code: MISSING_FIELD
                    message: transaction_id is required when format is MOSIP_SBI_SIGNED
                invalid_id_type:
                  summary: Unrecognised id_type value
                  value:
                    status: error
                    error_code: INVALID_ID
                    message: Invalid id_type
        "500":
          description: Unexpected processing failure, or the provider was unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                system_error:
                  summary: Provider could not be reached
                  value:
                    status: error
                    error_code: SYSTEM_ERROR
                    message: Unable to complete verification at this time

  /individual_registrations:
    post:
      tags:
        - Registration
      summary: Register individual SIM
      description: |
        Registers a SIM for an individual subscriber.

        This is the primary endpoint used by MNOs for individual SIM registration.

        Call POST /identity_verification first and send the
        `verification_reference` it returned.

        Processing flow:
          1. Validate the request payload structure
          2. Validate the verification_reference — it must exist, be unexpired,
             and be bound to the id_type + id_number in this request
          3. Validate mandatory registration fields
          4. Validate agent data
          5. Validate MSISDN format
          6. Re-evaluate the ownership limit
          7. Accept or reject the registration

        This endpoint does NOT carry a biometric and does NOT call a provider.
        Identity was already established in step 2, and the reference is the
        proof of it. Sending a `biometric` object here is a validation error.

        There is no time limit on this call. If SIM provisioning fails, you may
        submit the registration again with the same reference while it is valid.

        Operational notes:
          - acceptance means the record was stored, and returns
            REGISTRATION_ACCEPTED
          - rejection means payload validation, reference validation, or a
            policy rule failed
      operationId: createIndividualRegistration
      requestBody:
        required: true
        description: |
          Full individual SIM registration payload including identity data,
          the verification_reference, and registration agent details.
          No biometric data is carried here.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualRegistrationRequest"
            examples:
              ugandan_national:
                summary: Individual SIM registration for a Ugandan national
                value:
                  verification_reference: vrf_01JBK2QX7M4T8ZC3
                  msisdn: "256712345678"
                  sim_registration_type: NEW
                  sim_type: SIM
                  sim_registration_datetime: "2025-11-01T10:22:00Z"
                  id_type: NATIONAL ID
                  id_number: CF123456789ABCDE
                  nationality: UGANDAN
                  surname: KATO
                  given_name: JOHN
                  gender: MALE
                  date_of_birth: "1995-05-12"
                  id_validity: "2030-12-31"
                  agent_code: AGT001
                  agent_number: "256712345678"
                  sales_district: KAMPALA
                  gps_coordinates: "32.5825,0.3476"
                  activation_date: "2025-10-01"
              foreigner_passport:
                summary: Foreigner using a passport — reference from an unavailable provider
                value:
                  verification_reference: vrf_01JBK4TN0Q3X7ZE2
                  msisdn: "256712300001"
                  sim_registration_type: NEW
                  sim_type: ESIM
                  sim_registration_datetime: "2025-11-01T11:00:00Z"
                  id_type: PASSPORT
                  id_number: P12345678
                  nationality: KENYAN
                  surname: AYO
                  given_name: GRACE
                  gender: FEMALE
                  date_of_birth: "1997-02-11"
                  visa_permit_number: VISA12345
                  visa_validity: "2027-06-30"
                  agent_code: AGT002
                  agent_number: "256712300002"
                  sales_district: WAKISO
                  gps_coordinates: "32.5000,0.4000"
                  activation_date: "2025-10-01"
      responses:
        "200":
          description: Registration accepted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              examples:
                accepted:
                  summary: Registration stored
                  value:
                    status: accepted
                    reason_code: REGISTRATION_ACCEPTED
                    message: SIM registration stored
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: The verification_reference is missing, invalid, expired, bound to another identity, or the ownership limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                verification_required:
                  summary: No verification_reference supplied
                  value:
                    status: error
                    error_code: VERIFICATION_REQUIRED
                    message: A verification_reference from identity_verification is required
                reference_invalid:
                  summary: Reference is not recognised
                  value:
                    status: error
                    error_code: VERIFICATION_REFERENCE_INVALID
                    message: Verification reference is not recognised
                reference_expired:
                  summary: Reference is older than 24 hours
                  value:
                    status: error
                    error_code: VERIFICATION_REFERENCE_EXPIRED
                    message: Verification reference expired; re-verify the subscriber
                reference_mismatch:
                  summary: Reference was issued for a different identity
                  value:
                    status: error
                    error_code: VERIFICATION_REFERENCE_MISMATCH
                    message: Verification reference does not match the supplied identity
                limit_exceeded:
                  summary: Ownership limit reached at registration time
                  value:
                    status: error
                    error_code: LIMIT_EXCEEDED
                    message: Subscriber has exceeded SIM ownership limit
        "409":
          description: Registration conflicts with an existing record or duplicate request state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicate_registration:
                  summary: SIM already registered
                  value:
                    status: error
                    error_code: DUPLICATE_REQUEST
                    message: SIM already registered
        "422":
          description: Registration failed validation or business rule checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_msisdn:
                  summary: MSISDN format is invalid
                  value:
                    status: error
                    error_code: INVALID_MSISDN
                    message: Invalid MSISDN format
                invalid_agent:
                  summary: Agent data is invalid
                  value:
                    status: error
                    error_code: INVALID_AGENT
                    message: Agent number format is invalid
                missing_field:
                  summary: Required field is missing
                  value:
                    status: error
                    error_code: MISSING_FIELD
                    message: surname is required
                biometric_not_allowed:
                  summary: A biometric object was sent to a registration endpoint
                  value:
                    status: error
                    error_code: INVALID_PAYLOAD
                    message: biometric is not accepted here; send it to /identity_verification
        "500":
          description: Unexpected processing failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                system_error:
                  summary: Internal processing issue
                  value:
                    status: error
                    error_code: SYSTEM_ERROR
                    message: Unable to complete registration at this time

  /corporate_registrations:
    post:
      tags:
        - Registration
      summary: Register corporate SIM
      description: |
        Registers a SIM card for a corporate entity or institution.

        Verify the ORGANISATION first through POST /identity_verification,
        using its registration document — COI for a company or business, or
        REGISTRY_PENDING where UCC has not yet named the registry. Send the
        reference it returned as `verification_reference` here.

        The nominated representative is NO LONGER verified. Their details are
        still required, and are recorded for traceability, but no identity or
        biometric check is performed on them.

        Corporate registration includes:
          - organisation details
          - registration details
          - contact details
          - representative identity details — recorded, not verified
          - registration agent details

        No organisation registry is connected yet, so every corporate
        registration is currently accepted as UNVERIFIED.

        This endpoint is intended for:
          - companies
          - businesses
          - trusts
          - cooperatives
          - NGOs
          - ministries, departments and authorities
          - regional organisations
          - international organisations
      operationId: createCorporateRegistration
      requestBody:
        required: true
        description: |
          Full corporate SIM registration payload including representative
          identity and the verification_reference issued for that representative.
          No biometric data is carried here.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorporateRegistrationRequest"
            examples:
              business_registration:
                summary: Corporate registration
                value:
                  verification_reference: vrf_01JBK8XS4U7B1DJ6
                  id_type: COI
                  msisdn: "256712345679"
                  sim_type: SIM
                  sim_registration_type: NEW
                  sim_registration_datetime: "2025-11-01T10:22:00Z"
                  organisation_type: COMPANY
                  organisation_name: ABC LIMITED
                  registration_number: "80020012345678"
                  registration_validity: "2028-12-31"
                  registered_address: KAMPALA ROAD
                  tax_identification_number: TIN123456
                  contact_number: "256712345679"
                  representative:
                    id_type: NATIONAL ID
                    id_number: CF123456789ABCDE
                    nationality: UGANDAN
                    surname: KATO
                    given_name: JOHN
                    gender: MALE
                    date_of_birth: "1983-05-12"
                    validity: "2030-12-31"
                  agent_code: AGT001
                  agent_number: "256712345678"
                  sales_district: KAMPALA
                  gps_coordinates: "32.5825,0.3476"
                  activation_date: "2025-10-01"
      responses:
        "200":
          description: Corporate registration accepted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              examples:
                accepted:
                  summary: Corporate registration stored
                  value:
                    status: accepted
                    reason_code: REGISTRATION_ACCEPTED
                    message: Corporate SIM registration recorded
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: The verification_reference is missing, invalid, expired, bound to another identity, or the ownership limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                verification_required:
                  summary: No verification_reference supplied
                  value:
                    status: error
                    error_code: VERIFICATION_REQUIRED
                    message: A verification_reference for the representative is required
                reference_mismatch:
                  summary: Reference does not match the representative identity
                  value:
                    status: error
                    error_code: VERIFICATION_REFERENCE_MISMATCH
                    message: Verification reference does not match the representative identity
                reference_expired:
                  summary: Reference is older than 24 hours
                  value:
                    status: error
                    error_code: VERIFICATION_REFERENCE_EXPIRED
                    message: Verification reference expired; re-verify the representative
                limit_exceeded:
                  summary: Ownership limit reached at registration time
                  value:
                    status: error
                    error_code: LIMIT_EXCEEDED
                    message: Subscriber has exceeded SIM ownership limit
        "409":
          description: Registration conflicts with an existing record or duplicate request state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicate_registration:
                  summary: Duplicate corporate registration
                  value:
                    status: error
                    error_code: DUPLICATE_REQUEST
                    message: Corporate SIM already registered
        "422":
          description: Corporate registration failed validation or business rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
